name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# Everything runs from the repository root: the code is imported from there
# (pyproject.toml sets pytest's pythonpath), not installed as a package.
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/tests.yml
      - name: Install quality checks
        run: python -m pip install ruff==0.16.6
      - name: Lint
        run: python -m ruff check .
      - name: Format
        run: python -m ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: .github/workflows/tests.yml
      - name: Install dependencies (listed in pyproject.toml)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.0,<2.6" "scipy>=1.13" "matplotlib>=3.8" \
            "pillow>=10" "numba>=0.67,<0.68" "tqdm>=4.66" "pytest>=9.1,<10"
      - name: Test
        run: python -m pytest -q
      - name: CLI smoke test
        run: python -m simulations.population_release.run --help
